<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Markdown viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;0,7..72,700;1,7..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" id="hl-light" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css" integrity="sha384-eFTL69TLRZTkNfYZOLM+G04821K1qZao/4QLJbet1pP4tcF+fdXq/9CdqAbWRl/L" crossorigin="anonymous">
<link rel="stylesheet" id="hl-dark" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" integrity="sha384-wH75j6z1lH97ZOpMOInqhgKzFkAInZPPSPlZpYKYTOqsaizPvhQZmAtLcPKXpLyH" crossorigin="anonymous" disabled>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" integrity="sha384-/TQbtLCAerC3jgaim+N78RZSDYV7ryeoBCVqTuzRrFec2akfBkHS7ACQ3PQhvMVi" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
<style>
:root {
  --paper: #f3f5f2;
  --rail: #e7ebe6;
  --ink: #1d2321;
  --muted: #66706b;
  --line: #cfd6d0;
  --accent: #3346b8;
  --accent-soft: #dde2f7;
  --code-bg: #e9ede8;
  --side-w: 300px;
  --serif: "Literata", Georgia, "Times New Roman", serif;
  --sans: "Instrument Sans", -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #171b1a; --rail: #1e2321; --ink: #e2e7e3; --muted: #8e9993;
    --line: #333b37; --accent: #93a4ff; --accent-soft: #262d4d; --code-bg: #222826;
  }
}
:root[data-theme="dark"] {
  --paper: #171b1a; --rail: #1e2321; --ink: #e2e7e3; --muted: #8e9993;
  --line: #333b37; --accent: #93a4ff; --accent-soft: #262d4d; --code-bg: #222826;
}

* { box-sizing: border-box; }
html { scroll-padding-top: 24px; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--serif); }

/* ---------- sidebar ---------- */
.side {
  position: fixed; inset: 0 auto 0 0; width: var(--side-w);
  display: flex; flex-direction: column;
  background: var(--rail); border-right: 1px solid var(--line);
  font-family: var(--sans); font-size: 14px; z-index: 20;
}
.side-head { padding: 22px 20px 12px; }
.doc-title { margin: 0 0 4px; font-size: 15px; font-weight: 600; line-height: 1.3; }
.doc-meta { margin: 0; color: var(--muted); font-size: 12.5px; }
.tools { display: flex; gap: 6px; padding: 0 20px 12px; }
.filter {
  flex: 1; min-width: 0; font: inherit; font-size: 13px; color: var(--ink);
  background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 6px 9px;
}
.filter:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.icon-btn {
  font: inherit; font-size: 12px; color: var(--muted); background: transparent;
  border: 1px solid var(--line); border-radius: 6px; padding: 0 8px; cursor: pointer;
}
.icon-btn:hover { color: var(--ink); border-color: var(--muted); }
.icon-btn:focus-visible, .toc a:focus-visible, .twist:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.toc-wrap { flex: 1; overflow-y: auto; padding: 4px 12px 32px 14px; overscroll-behavior: contain; }
.toc, .toc ul { list-style: none; margin: 0; padding: 0; }
.toc ul { margin-left: 13px; border-left: 1px solid var(--line); padding-left: 2px; }
.toc li.collapsed > ul { display: none; }
.toc li.hidden { display: none; }
.row { display: flex; align-items: flex-start; position: relative; }
.twist {
  flex: none; width: 18px; height: 26px; padding: 0; border: 0; background: none;
  color: var(--muted); cursor: pointer; display: grid; place-items: center;
}
.twist svg { width: 9px; height: 9px; transition: transform .15s ease; }
.toc li:not(.collapsed) > .row > .twist svg { transform: rotate(90deg); }
.twist.leaf { visibility: hidden; }
.toc a {
  flex: 1; min-width: 0; display: block; padding: 4px 8px; border-radius: 5px;
  color: var(--muted); text-decoration: none; line-height: 18px;
}
.toc a:hover { color: var(--ink); background: color-mix(in srgb, var(--paper) 60%, transparent); }
.toc li.on-path > .row > a { color: var(--ink); }
.toc li.active > .row > a { color: var(--accent); background: var(--accent-soft); font-weight: 500; }
.toc li.active > .row::before {
  content: ""; position: absolute; left: -3px; top: 3px; bottom: 3px; width: 3px;
  border-radius: 2px; background: var(--accent);
}
.toc > li > .row > a { font-weight: 500; }
.toc mark { background: var(--accent-soft); color: inherit; border-radius: 2px; }
.empty-toc { color: var(--muted); padding: 8px; }

.side-foot { padding: 10px 20px; border-top: 1px solid var(--line); display: flex; gap: 6px; }
.side-foot .icon-btn { padding: 5px 8px; }

/* ---------- content ---------- */
main { margin-left: var(--side-w); padding: 56px 48px 40vh; }
.doc {
  max-width: 70ch; font-size: 18px; line-height: 1.7;
  font-variant-numeric: oldstyle-nums proportional-nums;
}
.doc h1, .doc h2, .doc h3, .doc h4, .doc h5, .doc h6 {
  font-weight: 600; line-height: 1.25; position: relative; scroll-margin-top: 24px;
}
.doc h1 { font-size: 2.3rem; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 1.2rem; }
.doc h2 { font-size: 1.6rem; margin: 3rem 0 0.8rem; padding-top: 1.2rem; border-top: 1px solid var(--line); }
.doc h3 { font-size: 1.25rem; margin: 2.2rem 0 0.6rem; }
.doc h4 { font-size: 1.05rem; margin: 1.8rem 0 0.4rem; }
.doc h5, .doc h6 { font-size: 1rem; margin: 1.5rem 0 0.4rem; color: var(--muted); }
.doc .anchor {
  position: absolute; left: -1.1em; padding-right: .3em; color: var(--muted);
  text-decoration: none; opacity: 0; font-weight: 400;
}
.doc h1:hover .anchor, .doc h2:hover .anchor, .doc h3:hover .anchor,
.doc h4:hover .anchor, .doc h5:hover .anchor, .doc h6:hover .anchor, .doc .anchor:focus { opacity: 1; }
.doc p, .doc ul, .doc ol, .doc blockquote, .doc table, .doc pre { margin: 0 0 1.1rem; }
.doc a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
.doc ul, .doc ol { padding-left: 1.5em; }
.doc li + li { margin-top: .25em; }
.doc li > input[type="checkbox"] { margin: 0 .4em 0 -1.3em; accent-color: var(--accent); }
.doc li:has(> input[type="checkbox"]) { list-style: none; }
.doc blockquote { margin-left: 0; padding: .1rem 0 .1rem 1.1rem; border-left: 3px solid var(--line); color: var(--muted); font-style: italic; }
.doc hr { border: 0; border-top: 1px solid var(--line); margin: 2.5rem 0; }
.doc img { max-width: 100%; height: auto; }
.doc code { font-family: var(--mono); font-size: .82em; background: var(--code-bg); padding: .12em .35em; border-radius: 4px; }
.doc pre { background: var(--code-bg); border-radius: 8px; padding: 14px 16px; overflow-x: auto; line-height: 1.5; }
.doc pre code { background: none; padding: 0; font-size: 13.5px; }
.doc pre code.hljs { background: none; padding: 0; }
.doc table { border-collapse: collapse; font-family: var(--sans); font-size: 14.5px; display: block; overflow-x: auto; max-width: 100%; }
.doc th, .doc td { border-bottom: 1px solid var(--line); padding: 7px 14px 7px 0; text-align: left; vertical-align: top; }
.doc th { font-weight: 600; border-bottom-color: var(--muted); }

/* ---------- empty state / drop ---------- */
.start { max-width: 46ch; font-family: var(--sans); margin-top: 10vh; }
.start h1 { font-family: var(--serif); font-size: 2rem; margin: 0 0 .6rem; }
.start p { color: var(--muted); line-height: 1.6; margin: 0 0 1.2rem; }
.btn {
  font: inherit; font-weight: 500; color: var(--paper); background: var(--ink);
  border: 0; border-radius: 6px; padding: 9px 16px; cursor: pointer;
}
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.dropzone {
  position: fixed; inset: 0; z-index: 50; display: none; place-items: center;
  background: color-mix(in srgb, var(--paper) 85%, transparent);
  font-family: var(--sans); font-size: 18px; color: var(--accent);
}
body.dragging .dropzone { display: grid; }
.dropzone span { border: 2px dashed var(--accent); border-radius: 12px; padding: 40px 56px; }
.error { color: #b3261e; font-family: var(--sans); }

/* ---------- mobile ---------- */
.menu-btn { display: none; }
@media (max-width: 860px) {
  .side { transform: translateX(-100%); transition: transform .2s ease; box-shadow: none; width: min(88vw, 320px); }
  body.side-open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.25); }
  main { margin-left: 0; padding: 64px 16px 40vh; }
  .doc { font-size: 17px; }
  .doc h1 { font-size: 1.8rem; }
  .menu-btn {
    display: block; position: fixed; top: 12px; left: 12px; z-index: 15;
    font-family: var(--sans); font-size: 13px; padding: 7px 12px; background: var(--rail); color: var(--ink);
  }
}
body.side-hidden .side { display: none; }
body.side-hidden main { margin-left: 0; }
body.side-hidden .menu-btn { display: block; position: fixed; top: 12px; left: 12px; z-index: 15; font-family: var(--sans); font-size: 13px; padding: 7px 12px; background: var(--rail); color: var(--ink); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } html { scroll-behavior: auto !important; } }
@media print { .side, .menu-btn { display: none; } main { margin: 0; padding: 0; } }
</style>
</head>
<body>
<nav class="side" aria-label="Table of contents">
  <div class="side-head">
    <p class="doc-title" id="docTitle">No document</p>
    <p class="doc-meta" id="docMeta"></p>
  </div>
  <div class="tools">
    <input class="filter" id="filter" type="search" placeholder="Filter headings  /" aria-label="Filter headings">
    <button class="icon-btn" id="expandAll" title="Expand all">+</button>
    <button class="icon-btn" id="collapseAll" title="Collapse all">−</button>
  </div>
  <div class="toc-wrap" id="tocWrap"><ul class="toc" id="toc"></ul></div>
  <div class="side-foot">
    <button class="icon-btn" id="openBtn">Open file</button>
    <button class="icon-btn" id="themeBtn">Theme</button>
    <button class="icon-btn" id="hideBtn" title="Hide sidebar ( [ )">Hide</button>
  </div>
</nav>
<button class="icon-btn menu-btn" id="menuBtn">Contents</button>
<main><article class="doc" id="doc"></article></main>
<div class="dropzone"><span>Drop a Markdown file to open it</span></div>
<input type="file" id="fileInput" accept=".md,.markdown,.mdown,.txt,text/markdown" hidden>

<!-- mdview CLI fills this with {"name": ..., "markdown": ..., "linkMd": true} -->
<script type="application/json" id="md-data"></script>

<script>
(() => {
  const TOC_DEPTH = 4; // deepest heading level shown in the sidebar
  const $ = (id) => document.getElementById(id);
  const docEl = $("doc"), tocEl = $("toc");
  let headings = [], items = [], linkMd = false;

  // ---------- theme ----------
  const themeKey = "mdview-theme";
  function applyTheme(t) {
    if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
    const dark = t ? t === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    $("hl-light").disabled = dark; $("hl-dark").disabled = !dark;
  }
  try { applyTheme(localStorage.getItem(themeKey)); } catch { applyTheme(null); }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => applyTheme(document.documentElement.dataset.theme));
  $("themeBtn").onclick = () => {
    const set = document.documentElement.dataset.theme;
    const dark = set ? set === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    const t = dark ? "light" : "dark";
    applyTheme(t);
    try { localStorage.setItem(themeKey, t); } catch {}
  };

  // ---------- rendering ----------
  function slugify(text, used) {
    let base = text.toLowerCase().trim()
      .replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s+/g, "-").replace(/-+/g, "-") || "section";
    let slug = base, n = 1;
    while (used.has(slug)) slug = `${base}-${n++}`;
    used.add(slug);
    return slug;
  }

  function render(markdown, name) {
    docEl.innerHTML = DOMPurify.sanitize(marked.parse(markdown, { gfm: true }));
    if (window.hljs) docEl.querySelectorAll("pre code").forEach((el) => hljs.highlightElement(el));

    if (linkMd) {
      docEl.querySelectorAll("a[href]").forEach((a) => {
        const href = a.getAttribute("href");
        if (!/^[a-z]+:/i.test(href)) a.setAttribute("href", href.replace(/\.(md|markdown)(?=$|#|\?)/i, ".html"));
      });
    }

    const used = new Set();
    headings = [...docEl.querySelectorAll("h1,h2,h3,h4,h5,h6")];
    headings.forEach((h) => {
      h.id = h.id || slugify(h.textContent, used);
      const a = document.createElement("a");
      a.className = "anchor"; a.href = "#" + h.id; a.textContent = "#"; a.setAttribute("aria-hidden", "true");
      h.prepend(a);
    });

    const h1s = headings.filter((h) => h.tagName === "H1");
    const title = h1s[0] ? text(h1s[0]) : (name || "Untitled");
    document.title = title;
    $("docTitle").textContent = title;
    const words = (docEl.textContent.match(/\S+/g) || []).length;
    $("docMeta").textContent = `${name ? name + ", " : ""}${Math.max(1, Math.round(words / 230))} min read`;

    // A lone H1 is the document title, so the tree starts at H2.
    const tocHeads = headings.filter((h) => +h.tagName[1] <= TOC_DEPTH && !(h1s.length === 1 && h === h1s[0]));
    buildToc(tocHeads);
    if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
    spy();
  }

  const text = (h) => [...h.childNodes].filter((n) => !n.classList?.contains("anchor")).map((n) => n.textContent).join("").trim();

  function buildToc(heads) {
    tocEl.innerHTML = ""; items = [];
    if (!heads.length) { tocEl.innerHTML = '<li class="empty-toc">No headings in this document.</li>'; return; }
    const minLevel = Math.min(...heads.map((h) => +h.tagName[1]));
    const stack = [{ level: minLevel - 1, ul: tocEl, li: null }];
    for (const h of heads) {
      const level = +h.tagName[1];
      while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
      const parent = stack[stack.length - 1];
      const li = document.createElement("li");
      li.innerHTML = `<div class="row"><button class="twist leaf" aria-label="Toggle section" tabindex="-1"><svg viewBox="0 0 10 10"><path d="M3 1.5 7 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><a href="#${h.id}"></a></div>`;
      const label = text(h);
      li.querySelector("a").textContent = label;
      li._label = label; li._heading = h; li._parentLi = parent.li;
      if (parent.li && !parent.ul) {
        parent.ul = document.createElement("ul"); parent.li.appendChild(parent.ul);
        const tw = parent.li.querySelector(".twist"); tw.classList.remove("leaf"); tw.tabIndex = 0;
      }
      parent.ul.appendChild(li);
      li._depth = stack.length - 1;
      if (li._depth >= 1) li.classList.add("collapsed");
      stack.push({ level, ul: null, li });
      items.push(li);
    }
    items.forEach((li) => { if (!li.querySelector(":scope > ul")) li.classList.remove("collapsed"); });
  }

  tocEl.addEventListener("click", (e) => {
    const tw = e.target.closest(".twist");
    if (tw) { tw.closest("li").classList.toggle("collapsed"); return; }
    if (e.target.closest("a") && innerWidth <= 860) document.body.classList.remove("side-open");
  });
  $("expandAll").onclick = () => items.forEach((li) => li.classList.remove("collapsed"));
  $("collapseAll").onclick = () => items.forEach((li) => li._depth >= 1 && li.querySelector(":scope > ul") && li.classList.add("collapsed"));

  // ---------- scrollspy ----------
  let current = null, ticking = false;
  function spy() {
    ticking = false;
    if (!items.length) return;
    let found = null;
    for (const li of items) {
      if (li._heading.getBoundingClientRect().top <= 60) found = li; else break;
    }
    found = found || items[0];
    if (found === current) return;
    items.forEach((li) => li.classList.remove("active", "on-path"));
    current = found;
    found.classList.add("active");
    for (let p = found._parentLi; p; p = p._parentLi) { p.classList.add("on-path"); p.classList.remove("collapsed"); }
    if (found.querySelector(":scope > ul")) found.classList.remove("collapsed");
    const row = found.querySelector(".row"), wrap = $("tocWrap");
    const r = row.getBoundingClientRect(), w = wrap.getBoundingClientRect();
    if (r.top < w.top + 20 || r.bottom > w.bottom - 20) wrap.scrollTop += r.top - w.top - w.height / 3;
  }
  addEventListener("scroll", () => { if (!ticking) { ticking = true; requestAnimationFrame(spy); } }, { passive: true });

  // ---------- filter ----------
  $("filter").addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    items.forEach((li) => { li.classList.remove("hidden"); li.querySelector("a").textContent = li._label; });
    if (!q) return;
    const keep = new Set();
    items.forEach((li) => {
      const i = li._label.toLowerCase().indexOf(q);
      if (i < 0) return;
      const a = li.querySelector("a");
      a.innerHTML = "";
      a.append(li._label.slice(0, i));
      const m = document.createElement("mark"); m.textContent = li._label.slice(i, i + q.length); a.append(m);
      a.append(li._label.slice(i + q.length));
      for (let p = li; p; p = p._parentLi) { keep.add(p); if (p !== li) p.classList.remove("collapsed"); }
    });
    items.forEach((li) => { if (!keep.has(li)) li.classList.add("hidden"); });
  });

  // ---------- sidebar toggles & keys ----------
  $("menuBtn").onclick = () => {
    if (document.body.classList.contains("side-hidden")) document.body.classList.remove("side-hidden");
    else document.body.classList.toggle("side-open");
  };
  $("hideBtn").onclick = () => document.body.classList.add("side-hidden");
  document.addEventListener("click", (e) => {
    if (document.body.classList.contains("side-open") && !e.target.closest(".side, .menu-btn")) document.body.classList.remove("side-open");
  });
  document.addEventListener("keydown", (e) => {
    if (e.target.matches("input, textarea")) { if (e.key === "Escape") e.target.blur(); return; }
    if (e.key === "/") { e.preventDefault(); document.body.classList.remove("side-hidden"); $("filter").focus(); }
    if (e.key === "[") document.body.classList.toggle("side-hidden");
  });

  // ---------- loading ----------
  function readFile(file) {
    if (!file) return;
    file.text().then((md) => { linkMd = false; history.replaceState(null, "", location.pathname); render(md, file.name); scrollTo(0, 0); });
  }
  $("openBtn").onclick = () => $("fileInput").click();
  $("fileInput").onchange = (e) => readFile(e.target.files[0]);
  let dragDepth = 0;
  addEventListener("dragenter", (e) => { e.preventDefault(); dragDepth++; document.body.classList.add("dragging"); });
  addEventListener("dragleave", () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove("dragging"); } });
  addEventListener("dragover", (e) => e.preventDefault());
  addEventListener("drop", (e) => { e.preventDefault(); dragDepth = 0; document.body.classList.remove("dragging"); readFile(e.dataTransfer.files[0]); });

  function showStart(msg) {
    docEl.innerHTML = `<div class="start"><h1>Open a Markdown file</h1>
      <p>Drop a <code>.md</code> file anywhere on this page, or choose one. Headings show up in the sidebar as a tree you can filter and fold.</p>
      <p class="error" hidden></p>
      <button class="btn" id="startOpen">Choose file</button></div>`;
    if (msg) { const e = docEl.querySelector(".error"); e.textContent = msg; e.hidden = false; }
    $("startOpen").onclick = () => $("fileInput").click();
    tocEl.innerHTML = '<li class="empty-toc">Headings appear here once a file is open.</li>';
  }

  const embedded = $("md-data").textContent.trim();
  const src = new URLSearchParams(location.search).get("src");
  if (embedded) {
    const data = JSON.parse(embedded);
    linkMd = !!data.linkMd;
    render(data.markdown, data.name);
  } else if (src && new URL(src, location.href).origin !== location.origin) {
    showStart("Only files from this site can be opened with ?src=.");
  } else if (src) {
    fetch(src).then((r) => { if (!r.ok) throw new Error(`${r.status} ${r.statusText}`); return r.text(); })
      .then((md) => render(md, src.split("/").pop()))
      .catch((err) => showStart(`Could not load ${src}: ${err.message}. Browsers block loading files from file:// pages, so serve this folder over http or use the mdview command.`));
  } else {
    showStart();
  }
})();
</script>
</body>
</html>
